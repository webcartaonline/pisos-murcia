<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pisos Murcia</title>
<meta name="theme-color" content="#efece7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pisos">
<link rel="stylesheet" href="css/ds.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<link rel="stylesheet" href="css/app.css">
<script>try{var t=localStorage.getItem('pisos-theme');document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
</head>
<body>
  <div class="gate" id="gate"><div class="gate-card"><i class="spin"></i></div></div>
  <div class="screen" id="app">
    <div class="views">
      <div class="view" id="home"></div>
      <div class="view off" id="mapv">
        <div id="map"></div>
        <div class="map-top">
          <div class="map-hd"><h2>Mapa</h2><button class="ibtn fbtn" data-a="mapFilters" id="fbtn"></button></div>
          <div class="chips" id="zones"></div>
        </div>
        <div class="mcount" id="mcount"></div>
        <div class="zoomc" id="zoomc"><button class="ibtn" data-a="zin" aria-label="Acercar"></button><button class="ibtn" data-a="zout" aria-label="Alejar"></button><button class="ibtn" data-a="zreg" aria-label="Toda la región"></button></div>
        <div class="map-foot hide" id="mfoot"></div>
      </div>
    </div>
    <nav class="tabbar">
      <button class="tab on" data-a="tab" data-t="home" id="t-home"></button>
      <button class="fab" data-a="add" aria-label="Añadir piso"></button>
      <button class="tab" data-a="tab" data-t="map" id="t-map"></button>
    </nav>
    <div id="detail"></div>
    <div id="sheets"></div>
    <div id="toast"><span></span><button></button></div>
    <input type="file" id="fileIn" accept="image/*" multiple hidden>
    <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
  </div>
<script src="js/nube.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
